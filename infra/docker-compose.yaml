
services:

  api:
    build:
      context: ..
      dockerfile: infra/dockerfile

    container_name: lightshift-api

    ports:
      - "8000:8000"

    volumes:
      - ../app:/workspace/app
      - ../data:/workspace/data
      - ../models:/workspace/models
      - ../notebooks:/workspace/notebooks

    environment:
      PYTHONPATH: /workspace
      MLFLOW_TRACKING_URI: http://mlflow:5000

    depends_on:
      mlflow:
        condition: service_started

    restart: unless-stopped

  mlflow:
    build:
      context: ..
      dockerfile: infra/dockerfile

    container_name: lightshift-mlflow

    command:
      - mlflow
      - server
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////workspace/mlflow/mlflow.db
      - --default-artifact-root
      - /workspace/mlflow/artifacts
      - --serve-artifacts

    ports:
      - "5000:5000"

    volumes:
      - mlflow_storage:/workspace/mlflow

    restart: unless-stopped

volumes:
  mlflow_storage:
